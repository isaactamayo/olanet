<script>
const $=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOutBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const easeOut=p=>1-Math.pow(1-p,3);
const TL=window.TL;
const COL={L:'#f5b700',M:'#8e5bd6',A:'#ff6b6b'};
const NAME={L:'Ángeles',M:'Natalia',A:'Ángeles y Natalia'};

/* ---------- piezas de dibujo ---------- */
const star=(cx,cy,r,fill,stroke='none',sw=0,ex='')=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;p.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1))}
 return `<polygon points="${p.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${ex}/>`};
const badge=(x,y,w,h,txt,fill,col='#fff',fs=46,ex='')=>`<g ${ex}><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${fill}" stroke="#fff" stroke-width="6"/><text x="${x}" y="${y+fs*0.36}" text-anchor="middle" font-weight="800" font-size="${fs}" fill="${col}">${txt}</text></g>`;
const cloud=(x,y,s,ex='')=>`<g transform="translate(${x},${y}) scale(${s})"><g ${ex}><ellipse cx="0" cy="0" rx="70" ry="38" fill="#fff"/><circle cx="-35" cy="-15" r="32" fill="#fff"/><circle cx="20" cy="-28" r="40" fill="#fff"/><circle cx="55" cy="-5" r="28" fill="#fff"/></g></g>`;
const tree=(x,y,s,c='#4caf50',ex='')=>`<g transform="translate(${x},${y}) scale(${s})"><g ${ex}><rect x="-14" y="-90" width="28" height="90" rx="8" fill="#8b5a2b"/><circle cx="0" cy="-130" r="70" fill="${c}"/><circle cx="-45" cy="-100" r="45" fill="${c}"/><circle cx="45" cy="-100" r="45" fill="${c}"/><circle cx="-20" cy="-150" r="18" fill="#fff" opacity=".18"/></g></g>`;
// adulto: hermano, Juan Bautista, maestro, familiar…  (x,y = pies)
function adult(x,y,s,o={}){
 const skin=o.skin||'#f6cfb0',coat=o.coat||'#1d1d2b',hair=o.hair||'#3b2a1e';
 const brows=o.angry?`<path d="M-30,-282 l20,8 M30,-282 l-20,8" stroke="#2a1a10" stroke-width="6" stroke-linecap="round"/>`:'';
 const mouth=o.angry?`<path d="M-14,-232 q14,-10 28,0" stroke="#7a2a20" stroke-width="5" fill="none" stroke-linecap="round"/>`:`<path d="M-16,-238 q16,14 32,0" stroke="#7a2a20" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 const hairBack=o.longHair?`<path d="M-56,-262 C-62,-330 62,-330 56,-262 L60,-200 L36,-205 L40,-250 L-40,-250 L-36,-205 L-60,-200Z" fill="${hair}"/>`:'';
 const dress=o.dress?`<path d="M-80,0 L-50,-190 Q0,-210 50,-190 L80,0Z" fill="${coat}"/><path d="M-50,-190 Q0,-170 50,-190 L44,-150 Q0,-135 -44,-150Z" fill="#fff" opacity=".85"/>`
  :`<path d="M-68,0 L-56,-196 Q0,-216 56,-196 L68,0Z" fill="${coat}"/>`;
 const hat=o.hat?`<path d="M-70,-300 Q0,-330 70,-300 Q40,-290 0,-288 Q-40,-290 -70,-300Z" fill="#2a2a2a"/><path d="M-40,-300 Q0,-360 40,-300Z" fill="#2a2a2a"/>`:'';
 const bun=o.bun?`<circle cx="0" cy="-318" r="22" fill="${hair}"/>`:'';
 const halo=o.halo?`<ellipse cx="0" cy="-322" rx="58" ry="16" fill="none" stroke="#ffd23f" stroke-width="9" ${o.halo}/>`:'';
 return `<g transform="translate(${x},${y}) scale(${s})">${hairBack}${dress}
  <path d="M-56,-190 Q-86,-120 -74,-70" stroke="${coat}" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M56,-190 Q86,-120 74,-70" stroke="${coat}" stroke-width="30" stroke-linecap="round" fill="none"/>
  <circle cx="-74" cy="-62" r="15" fill="${skin}"/><circle cx="74" cy="-62" r="15" fill="${skin}"/>
  ${o.rabat?`<path d="M-11,-202 h10 v34 h-12Z M1,-202 h10 l2,34 h-12Z" fill="#fff" stroke="#ccc" stroke-width="1.5"/>`:''}
  <circle cx="0" cy="-258" r="50" fill="${skin}"/>
  <path d="M-52,-258 C-56,-322 56,-322 52,-258 C40,-290 -40,-290 -52,-258Z" fill="${hair}"/>${bun}${hat}
  <circle cx="-18" cy="-262" r="6" fill="#2a1a10"/><circle cx="18" cy="-262" r="6" fill="#2a1a10"/>${brows}${mouth}
  <circle cx="-30" cy="-240" r="9" fill="#ff8fa3" opacity=".45"/><circle cx="30" cy="-240" r="9" fill="#ff8fa3" opacity=".45"/>
  ${o.book?`<g transform="translate(0,-110)"><rect x="-46" y="-30" width="92" height="60" rx="6" fill="#c0392b" stroke="#7b1f16" stroke-width="4"/><line x1="0" y1="-30" x2="0" y2="30" stroke="#7b1f16" stroke-width="4"/></g>`:''}
  ${halo}</g>`;
}
// niño/a (x,y = pies)
function kid(x,y,s,o={}){
 const skin=o.skin||'#f6cfb0',hair=o.hair||'#5a3a22',shirt=o.shirt||'#4aa3ff',pants=o.pants||'#2f3b66';
 const sad=`<path d="M-12,-148 q12,-10 24,0" stroke="#6b2a20" stroke-width="5" fill="none" stroke-linecap="round" ${o.sadAttr||''}/>`;
 const happy=`<path d="M-14,-154 q14,14 28,0" stroke="#6b2a20" stroke-width="5" fill="none" stroke-linecap="round" ${o.happyAttr||''}/>`;
 return `<g transform="translate(${x},${y}) scale(${s})"><g ${o.ex||''}>
  ${o.long?`<path d="M-48,-190 C-60,-250 60,-250 48,-190 L52,-130 L-52,-130Z" fill="${hair}"/>`:''}
  <rect x="-26" y="-62" width="20" height="62" rx="8" fill="${pants}"/><rect x="6" y="-62" width="20" height="62" rx="8" fill="${pants}"/>
  <rect x="-40" y="-130" width="80" height="80" rx="22" fill="${shirt}"/>
  ${o.patch?`<rect x="-22" y="-110" width="18" height="16" fill="#a1887f" stroke="#6d4c41" stroke-dasharray="4 3" stroke-width="2"/><rect x="10" y="-80" width="16" height="14" fill="#bcaaa4"/>`:''}
  <path d="M-38,-118 q-22,30 -16,58 M38,-118 q22,30 16,58" stroke="${shirt}" stroke-width="18" stroke-linecap="round" fill="none"/>
  <circle cx="-54" cy="-56" r="10" fill="${skin}"/><circle cx="54" cy="-56" r="10" fill="${skin}"/>
  <circle cx="0" cy="-180" r="46" fill="${skin}"/>
  <path d="M-48,-182 C-52,-242 52,-242 48,-182 C36,-208 -36,-208 -48,-182Z" fill="${hair}"/>
  <circle cx="-16" cy="-182" r="6" fill="#2a1a10"/><circle cx="16" cy="-182" r="6" fill="#2a1a10"/>
  <circle cx="-28" cy="-160" r="8" fill="#ff8fa3" opacity=".45"/><circle cx="28" cy="-160" r="8" fill="#ff8fa3" opacity=".45"/>
  ${o.sad?sad:''}${o.sad&&!o.happyAttr?'':happy}
  ${o.book?`<rect x="30" y="-100" width="40" height="50" rx="4" fill="${o.book}" stroke="#fff" stroke-width="3"/>`:''}
 </g></g>`;
}
const SKINS=['#f6cfb0','#e3ab82','#c68642','#8d5524','#f1c27d','#ffdbac'];
const HAIRS=['#2a1a10','#f2c046','#5a3a22','#111','#a0522d','#3b2314'];
const SHIRTS=['#4aa3ff','#ff6b6b','#ffd23f','#2ecc71','#ff8fd1','#8e5bd6','#ff9f43'];
function cathedral(x,y,s){ // y = base
 return `<g transform="translate(${x},${y}) scale(${s})">
  <rect x="-230" y="-330" width="120" height="330" fill="#d8c7ab" stroke="#a8916f" stroke-width="5"/>
  <rect x="110" y="-330" width="120" height="330" fill="#d8c7ab" stroke="#a8916f" stroke-width="5"/>
  <path d="M-230,-330 L-170,-430 L-110,-330Z M110,-330 L170,-430 L230,-330Z" fill="#b59c78"/>
  <path d="M-110,0 L-110,-260 L0,-360 L110,-260 L110,0Z" fill="#e6d8bf" stroke="#a8916f" stroke-width="5"/>
  <circle cx="0" cy="-220" r="52" fill="#6fa8ff" stroke="#a8916f" stroke-width="8"/>
  ${[0,45,90,135].map(a=>`<line x1="0" y1="-272" x2="0" y2="-168" stroke="#a8916f" stroke-width="5" transform="rotate(${a} 0 -220)" style="transform-box:view-box"/>`).join('')}
  <path d="M-48,0 L-48,-90 Q0,-150 48,-90 L48,0Z" fill="#7a5230"/>
  ${[-200,-140,140,200].map(cx=>`<path d="M${cx-16},-120 L${cx-16},-210 Q${cx},-240 ${cx+16},-210 L${cx+16},-120Z" fill="#6fa8ff" opacity=".85"/>`).join('')}
  <path d="M-170,-430 v-30 M170,-430 v-30 M0,-360 v-40 M-12,-388 h24" stroke="#a8916f" stroke-width="6"/>
 </g>`;
}
function school(x,y,s,o={}){
 const wall=o.wall||'#ffe8c2',roof=o.roof||'#e2574c';
 return `<g transform="translate(${x},${y}) scale(${s})">
  <rect x="-240" y="-330" width="480" height="330" fill="${wall}" stroke="#e0a96d" stroke-width="6"/>
  <path d="M-265,-320 L0,-480 L265,-320Z" fill="${roof}" stroke="#b83f36" stroke-width="6" stroke-linejoin="round"/>
  ${star(0,-385,48,'#ffd23f','#e0a800',5,o.starAttr||'')}
  ${[-170,-85,85,170].map(cx=>[-270,-150].map(cy=>`<rect x="${cx-30}" y="${cy}" width="60" height="70" rx="8" fill="#8fd3ff" stroke="#fff" stroke-width="6"/><path d="M${cx},${cy} v70 M${cx-30},${cy+35} h60" stroke="#fff" stroke-width="4"/>`).join('')).join('')}
  <path d="M-50,0 L-50,-120 Q0,-170 50,-120 L50,0Z" fill="#a0522d" stroke="#7a3b1d" stroke-width="5"/>
  ${o.sign?`<rect x="-120" y="-318" width="240" height="44" rx="12" fill="#25408f"/><text x="0" y="-284" text-anchor="middle" font-weight="800" font-size="34" fill="#fff">${o.sign}</text>`:''}
 </g>`;
}
function coin(x,y,r=22,ex=''){return `<g ${ex}><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd23f" stroke="#e0a800" stroke-width="4"/><circle cx="${x}" cy="${y}" r="${r*0.6}" fill="none" stroke="#e0a800" stroke-width="3"/></g>`}
const heart=(x,y,s,c='#ff4d6d',ex='')=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M0,30 C-60,-10 -30,-60 0,-30 C30,-60 60,-10 0,30Z" fill="${c}" ${ex}/></g>`;

function tspec(spec,s){ if(spec==null||spec==='')return null;spec=String(spec);
 let m=spec.match(/^L(\d+)([+-][\d.]+)?$/);if(m)return s.lineas[+m[1]].start-s.start+(+(m[2]||0));
 m=spec.match(/^E([+-][\d.]+)?$/);if(m)return s.dur+(+(m[1]||0));return +spec;}
const EVENTS=[];
scenes.forEach((s,si)=>{
 $('[data-stagger]',s.el).forEach(g=>{const [b,st]=g.dataset.stagger.split(',');const t0=tspec(b,s);[...g.children].forEach((c,i)=>{if(!c.dataset.in){c.dataset.in=(t0+i*(+st)).toFixed(3);c.dataset.anim=c.dataset.anim||'pop';c.dataset.sfx=c.dataset.sfx||'tick'}})});
 // los elementos con transform propio se envuelven para no perder su posición al animarlos
 $('[data-in],[data-out],[data-spin],[data-bob],[data-swing],[data-drift],[data-pulse],[data-shake],[data-twinkle]',s.el).forEach(el=>{
  if(!el.hasAttribute('transform'))return;const w=document.createElementNS('http://www.w3.org/2000/svg','g');
  el.parentNode.insertBefore(w,el);w.appendChild(el);
  [...el.attributes].filter(a=>a.name.startsWith('data-')).forEach(a=>{w.setAttribute(a.name,a.value);el.removeAttribute(a.name)});});
 $('[data-in],[data-out]',s.el).forEach(el=>{el._tin=el.dataset.in!=null?tspec(el.dataset.in,s):-1;el._tout=el.dataset.out!=null?tspec(el.dataset.out,s):1e9;
   if(el.dataset.sfx)EVENTS.push({t:s.start+el._tin,k:el.dataset.sfx})});
 $('[data-count]',s.el).forEach(el=>{const p=el.dataset.count.split(',');el._c=[tspec(p[0],s),+p[1],+p[2],+p[3]]});
 $('[data-prog]',s.el).forEach(el=>{const p=el.dataset.prog.split(',');el._p=[tspec(p[0],s),tspec(p[1],s)]});
 if(si>0)EVENTS.push({t:s.start,k:'whoosh'});
 const SEL='[data-in],[data-out],[data-spin],[data-bob],[data-swing],[data-drift],[data-pulse],[data-shake],[data-twinkle]';
 s._anim=$(SEL,s.el);

});

function setSub(line){
 if(line===lastLine)return;lastLine=line;
 if(!line){sub.style.opacity=0;return}
 subtxt.innerHTML=line.text.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');
 line._words=$('.w',subtxt);let acc=0;const L=line.text.length;line._words.forEach(w=>{w._p=(acc+w.textContent.length*0.3)/L;acc+=w.textContent.length+1});

function mouth(id,o,t){
 const smile=document.getElementById(id+'-smile'),mo=document.getElementById(id+'-mo'),tg=document.getElementById(id+'-tg');
 const cy=id==='L'?352:356;
 if(o<0.06){smile.style.display='';mo.parentNode.style.display='none';return}
 smile.style.display='none';mo.parentNode.style.display='';
 const w=24+o*8,h=8+o*30;
 mo.setAttribute('d',`M${250-w},${cy} Q250,${cy-6} ${250+w},${cy} Q250,${cy+h*1.6} ${250-w},${cy}Z`);
 tg.setAttribute('cy',cy+h*0.55);tg.setAttribute('rx',w*0.5);tg.setAttribute('ry',Math.max(2,h*0.25));
}
function render(t){
 const s=scenes.find(x=>t>=x.start&&t<x.start+x.dur)||(t<scenes[0].start?scenes[0]:scenes[scenes.length-1]);
 const lt=t-s.start;
 if(s!==lastScene){scenes.forEach(x=>x.el.style.display=x===s?'block':'none');
  const prev=lastScene;lastScene=s;
  document.getElementById('bgA').style.background=prev?`linear-gradient(${BG[prev.id][0]},${BG[prev.id][1]})`:'none';
  document.getElementById('bgB').style.background=`linear-gradient(${BG[s.id][0]},${BG[s.id][1]})`;
  title.textContent=s.titulo;title.style.background=TCOL[s.id];}
 const first=s===scenes[0];
 document.getElementById('bgB').style.opacity=first?1:clamp(lt/0.8);
 // transición del panel
 const pin=easeOutBack(clamp(lt/0.55)),pout=clamp((lt-(s.dur-0.3))/0.3);
 const isLast=s===scenes[scenes.length-1];
 const sc=s.el;sc.style.opacity=(first?1:clamp(lt/0.25))*(isLast?1:1-pout);
 sc.style.transform=`scale(${(first?1:0.92+0.08*pin)*(isLast?1:1-0.05*pout)})`;
 title.style.transform=`translateX(-50%) scale(${first?1:easeOutBack(clamp(lt/0.5)).toFixed(3)}) rotate(${(Math.sin(t*2)*1.5).toFixed(2)}deg)`;
 // animaciones de elementos
 for(const el of s._anim){
  let o=1,sx=1,dx=0,dy=0,rot=0;const d=el.dataset;
  if(d.in!=null||d.out!=null){
   const a=el._tin,b=el._tout;
   if(lt<a){o=0;sx=0}else{const p=clamp((lt-a)/0.45),an=d.anim||'pop';o=clamp((lt-a)/0.2);
    if(an==='pop')sx=easeOutBack(p);else if(an==='up')dy=(1-easeOut(p))*80;else if(an==='left')dx=(1-easeOut(p))*-120;else if(an==='right')dx=(1-easeOut(p))*300;}
   if(lt>b){const q=clamp((lt-b)/0.3);o*=1-q;if((d.anim||'pop')==='pop')sx*=1-q*0.4}
  }
  if(d.bob){const[a,f]=d.bob.split(',').map(Number);dy+=Math.sin(t*f+(el._ph??=Math.random()*6))*a}
  if(d.spin)rot+=t*(+d.spin);
  if(d.swing){const[a,f]=d.swing.split(',').map(Number);rot+=Math.sin(t*f)*a}
  if(d.drift){dx+=lt*(+d.drift);}
  if(d.pulse){const[a,f]=d.pulse.split(',').map(Number);sx*=1+Math.sin(t*f*2)*a}
  if(d.shake&&lt>=el._tin)dx+=Math.sin(lt*45)*6*(lt<el._tout?1:0);
  if(d.twinkle!=null){o*=0.35+0.65*Math.abs(Math.sin(t*1.3+(+d.twinkle)))}
  el.style.opacity=o.toFixed(3);
  el.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${Math.max(0,sx).toFixed(4)})`;
 }
 $('[data-count]',sc).forEach(el=>{const[a,dur,f0,f1]=el._c;const p=easeOut(clamp((lt-a)/dur));let v=Math.round(f0+(f1-f0)*p);
  el.textContent=v.toLocaleString('es-ES')+(el.dataset.plus&&p>=1?'+':'')});
 $('[data-prog]',sc).forEach(el=>{const[a,b]=el._p;el.setAttribute('width',(840*clamp((lt-a)/(b-a))).toFixed(1))});
 $('.fly',sc).forEach(el=>{const[x0,y0,x1,y1,h,per,ph]=el.dataset.fly.split(',').map(Number);const st=el.parentNode._tin;
  const p=(((lt-st)/per+ph)%1+1)%1;const x=x0+(x1-x0)*p,y=y0+(y1-y0)*p-h*4*p*(1-p);
  el.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(p*360).toFixed(0)})`);el.style.opacity=lt<st?0:clamp(Math.min(p,1-p)*8)});
 $('.conf',sc).forEach(el=>{const[x,off,sp]=el.dataset.fall.split(',').map(Number);const st=el.parentNode._tin;const y=((lt-st)*sp+off)%1000-60;
  el.setAttribute('transform',`translate(${(x+Math.sin(lt*2+off)*30).toFixed(1)},${y.toFixed(1)}) rotate(${((lt*200+off)%360).toFixed(0)})`)});
 // fondo
 $('.fl',fl).forEach(g=>{const i=+g.dataset.i;const x=(i*157+t*(12+i%5*4))%1180-50,y=1980-(((t*(22+i%4*8))+i*150)%2100);
  g.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(t*30+i*20)%360})`)});
 $('.flw').forEach(g=>{const i=+g.dataset.i;g.setAttribute('transform',`rotate(${(Math.sin(t*1.5+i)*12).toFixed(1)})`)});
 // frase actual, subtítulos y bocas
 const lines=s.lineas;let cur=null,open={L:0,M:0},spk={L:false,M:false};
 for(const ln of lines){if(t>=ln.start-0.1)cur=ln;}
 setSub(cur);
 if(!cur&&first){setSub(COVER);sub.style.opacity=1;sub.style.transform='scale(1)';COVER._words.forEach(w=>w.classList.add('on'));}
 else if(cur){sub.style.opacity=1;const p=clamp((t-cur.start)/cur.dur);cur._words.forEach(w=>w.classList.toggle('on',w._p<=p));
  const k=Math.floor((t-cur.start)*TL.fps);
  for(const g in cur.env){if(k>=0&&k<cur.env[g].length){const e=cur.env[g];open[g]=(e[k]+(e[k+1]??e[k]))/2;spk[g]=true}}
  const sp=clamp((t-cur.start+0.1)/0.25);sub.style.transform=cur===lines[0]&&t<cur.start+0.4?`scale(${easeOutBack(sp)})`:'scale(1)';}
 else sub.style.opacity=0;
 mouth('L',open.L,t);mouth('M',open.M,t);
 // cuerpo de las niñas
 const wave=first&&!cur?'LM':cur&&t<cur.start+cur.dur+0.3?WAVE[s.id+':'+lines.indexOf(cur)]||'':'';
 for(const g of ['L','M']){
  const el=document.getElementById('g'+g);const talking=spk[g];
  const bob=talking?Math.abs(Math.sin(t*6))*8:Math.sin(t*1.6+(g==='M'?1.5:0))*3;
  el.style.transform=`translateY(${(-bob).toFixed(1)}px) rotate(${(Math.sin(t*1.2+(g==='M'?2:0))*(talking?2.2:1)).toFixed(2)}deg) scale(${talking?1.03:1})`;
  // parpadeo
  const per=g==='L'?3.9:4.6,off=g==='L'?0.3:1.9;const bl=((t+off)%per)<0.13;
  $('#'+g+'-eyes > g').forEach(e=>e.style.transform=bl?'scaleY(0.1)':'');
  const w=document.getElementById(g+'-wave');const wv=wave.includes(g);
  w.style.display=wv?'':'none';
  if(wv)w.style.transform=`rotate(${(Math.sin(t*9)*(g==='L'?-14:14)).toFixed(1)}deg)`;
  document.getElementById('tag'+g).style.transform=`scale(${talking?1.12:1})`;
 }
 document.getElementById('L-pony').style.transform=`rotate(${(Math.sin(t*3.2)*7).toFixed(2)}deg)`;
 // fundido de entrada/salida
 const fd=document.getElementById('fade');fd.style.background=t<5?'#fff':'#141c4d';
 fd.style.opacity=clamp((t-(TL.total-1.0))/1.0).toFixed(3);
}
window.render=render;render(0);
</script></body></html>
